services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - rag-network

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-network

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - rag-network

  postgres:
    container_name: rag-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: rag_medical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  redis:
    container_name: rag-redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  neo4j:
    container_name: rag-neo4j
    image: neo4j:5.12
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  rag-app:
    container_name: rag-app
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: rag_medical
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_DIM: 384
      COLLECTION_MEDICAL_QA: ${COLLECTION_MEDICAL_QA:-medical_qa_demo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      JINA_RERANK_MODEL: ${JINA_RERANK_MODEL:-jina-reranker-v2-base-multilingual}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      ALLOW_UNTRUSTED_USER_ID: ${ALLOW_UNTRUSTED_USER_ID:-true}
      USE_LOCAL_MODEL: ${USE_LOCAL_MODEL:-true}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-qwen2.5:7b}
      INIT_KNOWLEDGE_GRAPH: ${INIT_KNOWLEDGE_GRAPH:-true}
      INIT_VECTOR_DATA: ${INIT_VECTOR_DATA:-true}
      COLLECTION_MEDICAL_QA_BUILD: ${COLLECTION_MEDICAL_QA_BUILD:-medical_qa_demo}
      KG_IMPORT_LIMIT: ${KG_IMPORT_LIMIT:-200}
      VECTOR_IMPORT_LIMIT: ${VECTOR_IMPORT_LIMIT:-2000}
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./model_cache:/app/model_cache
      - ./data:/app/data
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
